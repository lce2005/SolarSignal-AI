<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar-n8n-FinFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span>Low-Code AI Challenge — Solar-n8n-FinFlow</span>
  </header>

  <main class="workspace">
    <section class="panel input-panel">
      <h1>투자 데이터 업로드</h1>
      <p>종목명을 입력하여 뉴스를 수집하거나, 증권사 리포트/공시 PDF를 업로드하면 n8n 워크플로우가 AI 인사이트를 생성합니다.</p>

      <label>
        n8n Webhook URL
        <input id="webhookUrl" value="http://localhost:5678/webhook-test/solar-stock/analyze">
      </label>

      <div class="mode-row" role="group" aria-label="입력 방식">
        <button id="textMode" class="active" type="button">실시간 뉴스 수집</button>
        <button id="fileMode" type="button">리포트/공시 (PDF)</button>
      </div>

      <label id="textBox">
        분석할 종목명
        <input id="content" type="text" placeholder="예: 삼성전자, SK하이닉스, 현대차" style="width: 100%; border: 1px solid #cbd5e5; border-radius: 6px; padding: 12px; color: #172033; font: inherit;">
      </label>

      <label id="fileBox" class="hidden">
        리포트/공시 파일
        <input id="document" type="file" accept="image/png,image/jpeg,image/jpg,application/pdf">
      </label>

      <button id="analyze" class="primary" type="button">분석하기</button>
      <p id="status" class="status"></p>
    </section>

    <section class="panel output-panel">
      <div class="result-head">
        <h2>📊 AI 투자 리포트</h2>
      </div>
      <div id="feedback" class="feedback empty">아직 분석 결과가 없습니다.</div>

      <h2>구조화된 데이터 (JSON)</h2>
      <div id="quiz" class="quiz empty">분석 후 정형화된 데이터 스키마가 표시됩니다.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
